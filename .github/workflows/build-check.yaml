name: Build Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests and drift check
        if: false  # verify branch only: this gate rejects any non-base tree
        run: |
          pip install -r tools/requirements.txt
          python -m pytest -q tools
          python tools/generate.py --check
      - name: Build both apps
        run: ./gradlew --no-daemon :app:assembleRelease :s3b:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: "*/build/outputs/apk/release/*.apk"
          retention-days: 14
